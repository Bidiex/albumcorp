<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbumCorp</title>
    <link rel="icon" type="image/webp" href="/favicon-corpalbum.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
</head>

<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <img src="/favicon-corpalbum.webp" alt="AlbumCorp Logo" class="brand-logo"> AlbumCorp
                </div>
                <div class="auth-subtitle" style="text-align: center; font-size: 0.9rem; color: var(--text-secondary); margin-top: -8px; font-weight: 500;">
                    Portal de administración de álbumes para empresas
                </div>

                <div class="auth-tabs">
                    <button id="tab-login" class="active">Iniciar sesión</button>
                    <button id="tab-register">Registrarme</button>
                </div>

                <!-- Formulario Login -->
                <form id="form-login" class="auth-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Contraseña" required>
                    <button type="submit" id="btn-login" class="btn-primary">Entrar</button>
                    <div id="login-error" class="auth-error"></div>
                    <div class="auth-divider">
                        <span>o</span>
                    </div>
                    <button type="button" id="btn-google-login" class="btn-google">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" 
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                            <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
                            <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                        </svg>
                        Continuar con Google
                    </button>
                </form>

                <!-- Formulario Registro -->
                <form id="form-register" class="auth-form" hidden>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-password" placeholder="Contraseña" required>
                    <input type="password" id="reg-confirm-password" placeholder="Confirmar contraseña" required>
                    <button type="submit" id="btn-register" class="btn-primary">Crear cuenta</button>
                    <div id="register-error" class="auth-error"></div>
                    <div class="auth-divider">
                        <span>o</span>
                    </div>
                    <button type="button" id="btn-google-register" class="btn-google">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" 
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                            <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
                            <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                        </svg>
                        Continuar con Google
                    </button>
                </form>

                <div class="auth-footer">
                    ¿Eres empleado? Usa el link que te envió tu empresa
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { loginUser, registerEditor, getSession, getCurrentProfile, loginWithGoogleEditor } from './js/core/auth.js';

        // Elementos DOM
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const formLogin = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');
        const btnLogin = document.getElementById('btn-login');
        const btnRegister = document.getElementById('btn-register');
        const loginError = document.getElementById('login-error');
        const registerError = document.getElementById('register-error');

        // Al cargar: verificar sesión activa
        window.addEventListener('load', async () => {
            const session = await getSession();
            if (session) {
                const profile = await getCurrentProfile();
                if (profile) {
                    if (profile.role === 'editor') {
                        window.location.href = '/editor';
                    } else if (profile.role === 'employee' && profile.company_id) {
                        window.location.href = '/album';
                    }
                }
            }
        });

        // Tab Switching
        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            formLogin.hidden = false;
            formRegister.hidden = true;
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            formRegister.hidden = false;
            formLogin.hidden = true;
        });

        // Manejo de Login
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                loginError.classList.remove('visible');
                btnLogin.disabled = true;
                btnLogin.textContent = 'Cargando...';

                await loginUser(email, password);
                const profile = await getCurrentProfile();
                window.location.href = profile.role === 'editor' ? '/editor' : '/album';
            } catch (error) {
                loginError.textContent = error.message;
                loginError.classList.add('visible');
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar';
            }
        });

        document.getElementById('btn-google-login')
            ?.addEventListener('click', async () => {
                try {
                    await loginWithGoogleEditor();
                } catch (error) {
                    loginError.textContent = error.message;
                    loginError.classList.add('visible');
                }
            });

        // Manejo de Registro
        formRegister.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) {
                registerError.textContent = 'Las contraseñas no coinciden.';
                registerError.classList.add('visible');
                return;
            }

            try {
                registerError.classList.remove('visible');
                btnRegister.disabled = true;
                btnRegister.textContent = 'Cargando...';

                // Registrar cuenta básica de editor — los datos se pedirán en el onboarding
                await registerEditor(email, password);
                window.location.href = '/editor';
            } catch (error) {
                registerError.textContent = error.message;
                registerError.classList.add('visible');
            } finally {
                btnRegister.disabled = false;
                btnRegister.textContent = 'Crear cuenta';
            }
        });

        document.getElementById('btn-google-register')
            ?.addEventListener('click', async () => {
                try {
                    await loginWithGoogleEditor();
                } catch (error) {
                    registerError.textContent = error.message;
                    registerError.classList.add('visible');
                }
            });
    </script>
</body>

</html>
