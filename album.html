<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaniniCorp — Mi Álbum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/sticker.css">
  <link rel="stylesheet" href="/css/album.css">
  <link rel="stylesheet" href="/css/exchange.css">
</head>
<body>
  <div id="album-container">
    <div id="progress-container" class="album-progress">
      <span class="album-progress__icon">🏆</span>
      <span id="progress-text">Cargando...</span>
    </div>
    <div class="album-viewport">
      <div id="book">
        <!-- StPageFlip renderizará aquí -->
      </div>
    </div>
    <div class="album-nav">
      <button id="btn-prev">← Anterior</button>
      <button id="btn-next">Siguiente →</button>
    </div>
    
    <div id="bottom-actions" class="floating-actions">
      <button id="btn-open-pack">Cargando...</button>
    </div>
  </div>

  <script type="module" src="/js/album/album.js"></script>
</body>
</html>
