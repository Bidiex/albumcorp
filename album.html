<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaniniCorp — Mi Álbum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/sticker.css">
  <link rel="stylesheet" href="/css/album.css">
  <link rel="stylesheet" href="/css/exchange.css">
</head>
<body>
  <!-- Pantalla de carga preloader -->
  <div id="album-preloader" class="preloader">
    <div class="preloader__content">
      <div class="preloader__logo">🏆</div>
      <h2 class="preloader__title">Cargando Álbum Mundial...</h2>
      <div class="preloader__bar-container">
        <div id="preloader-bar" class="preloader__bar"></div>
      </div>
      <p id="preloader-status" class="preloader__status">Iniciando pre-carga de imágenes y música...</p>
      <button id="btn-preloader-open" class="preloader__btn" style="display: none;">¡Abrir Álbum! 📖</button>
    </div>
  </div>

  <div id="album-container">
    <div id="progress-container" class="album-progress">
      <span class="album-progress__icon">🏆</span>
      <span id="progress-text">Cargando...</span>
    </div>
    <div class="album-viewport">
      <button id="btn-prev" class="nav-arrow nav-arrow--left" aria-label="Página anterior">‹</button>
      <div id="book">
        <!-- StPageFlip renderizará aquí -->
      </div>
      <button id="btn-next" class="nav-arrow nav-arrow--right" aria-label="Siguiente página">›</button>
    </div>
    
    <div id="bottom-actions" class="floating-actions">
      <!-- Los botones de Mi Baúl e Intercambiar se insertan aquí vía JS -->
    </div>
    <div id="pack-btn-container" class="pack-container">
      <button id="btn-open-pack">🎁</button>
      <span id="pack-count-badge" class="pack-badge-counter">0</span>
    </div>
  </div>

  <script type="module" src="/js/album/album.js"></script>

  <div id="user-menu-backdrop" class="user-menu-backdrop"></div>
  <div id="user-menu" class="user-menu">
    <div class="user-menu__header">
      <div class="user-menu__avatar" id="menu-avatar">?</div>
      <div class="user-menu__info">
        <span class="user-menu__name" id="menu-name">...</span>
        <span class="user-menu__role">Coleccionista</span>
      </div>
      <button class="user-menu__close" id="btn-close-user-menu">✕</button>
    </div>
    <div class="user-menu__stats">
      <div class="user-menu__stat">
        <span class="user-menu__stat-value" id="menu-sticker-count">0</span>
        <span class="user-menu__stat-label">laminitas</span>
      </div>
      <div class="user-menu__stat">
        <span class="user-menu__stat-value" id="menu-completion">0%</span>
        <span class="user-menu__stat-label">completado</span>
      </div>
    </div>
    <div class="user-menu__actions">
      <a href="/mi-laminita.html" class="user-menu__action-btn">
        ✨ Crear mi laminita
      </a>
      <button class="user-menu__action-btn" id="btn-logout-menu">
        🚪 Cerrar sesión
      </button>
      <button class="user-menu__action-btn user-menu__action-btn--danger" 
        id="btn-delete-account">
        Eliminar cuenta
      </button>
    </div>
  </div>
</body>
</html>
