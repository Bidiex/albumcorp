<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbumCorp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
</head>

<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">AlbumCorp</div>

                <div class="auth-tabs">
                    <button id="tab-login" class="active">Iniciar sesión</button>
                    <button id="tab-register">Soy Editor — Registrarme</button>
                </div>

                <!-- Formulario Login -->
                <form id="form-login" class="auth-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Contraseña" required>
                    <button type="submit" id="btn-login" class="btn-primary">Entrar</button>
                    <div id="login-error" class="auth-error"></div>
                </form>

                <!-- Formulario Registro -->
                <form id="form-register" class="auth-form" hidden>
                    <input type="text" id="reg-name" placeholder="Nombre completo" required>
                    <input type="text" id="reg-company" placeholder="Nombre de tu empresa" required>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-password" placeholder="Contraseña" required>
                    <button type="submit" id="btn-register" class="btn-primary">Crear cuenta</button>
                    <div id="register-error" class="auth-error"></div>
                </form>

                <div class="auth-footer">
                    ¿Eres empleado? Usa el link que te envió tu empresa
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { loginUser, registerEditor, getSession, getCurrentProfile } from './js/core/auth.js';

        // Elementos DOM
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const formLogin = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');
        const btnLogin = document.getElementById('btn-login');
        const btnRegister = document.getElementById('btn-register');
        const loginError = document.getElementById('login-error');
        const registerError = document.getElementById('register-error');

        // Al cargar: verificar sesión activa
        window.addEventListener('load', async () => {
            const session = await getSession();
            if (session) {
                const profile = await getCurrentProfile();
                if (profile) {
                    window.location.href = profile.role === 'editor' ? '/editor' : '/album';
                }
            }
        });

        // Tab Switching
        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            formLogin.hidden = false;
            formRegister.hidden = true;
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            formRegister.hidden = false;
            formLogin.hidden = true;
        });

        // Manejo de Login
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                loginError.classList.remove('visible');
                btnLogin.disabled = true;
                btnLogin.textContent = 'Cargando...';

                await loginUser(email, password);
                const profile = await getCurrentProfile();
                window.location.href = profile.role === 'editor' ? '/editor' : '/album';
            } catch (error) {
                loginError.textContent = error.message;
                loginError.classList.add('visible');
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar';
            }
        });

        // Manejo de Registro
        formRegister.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const company = document.getElementById('reg-company').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            try {
                registerError.classList.remove('visible');
                btnRegister.disabled = true;
                btnRegister.textContent = 'Cargando...';

                // Usamos el nombre del editor y el de la empresa
                await registerEditor(name, company, email, password);
                window.location.href = '/editor';
            } catch (error) {
                registerError.textContent = error.message;
                registerError.classList.add('visible');
            } finally {
                btnRegister.disabled = false;
                btnRegister.textContent = 'Crear cuenta';
            }
        });
    </script>
</body>

</html>
