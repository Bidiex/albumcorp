<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaniniCorp — Unirse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <style>
        .join-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-md);
            background: var(--bg-main);
        }

        .join-card {
            background: var(--surface);
            border: var(--border-width) solid var(--border-main);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-offset-lg);
            width: 100%;
            max-width: 420px;
            padding: var(--space-xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            transition: transform var(--transition-base), box-shadow var(--transition-base);
        }

        .join-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-offset-lg);
        }

        .join-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: var(--space-xs);
        }

        .join-logo-emoji {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: var(--space-xs);
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.1));
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .join-company-name {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .join-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Tabs con estilo pill premium */
        .join-tabs {
            display: flex;
            background: var(--surface-soft);
            border: var(--border-width) solid var(--border-main);
            border-radius: var(--radius-md);
            padding: 4px;
            gap: 4px;
        }

        .join-tabs button {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px var(--space-md);
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .join-tabs button.active {
            background: var(--surface);
            color: var(--text-main);
            border: 1.5px solid var(--border-main);
            box-shadow: var(--shadow-offset-sm);
        }

        /* Formularios */
        .join-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .join-form[hidden] {
            display: none;
        }

        .join-form .btn-primary {
            width: 100%;
            justify-content: center;
            padding: 13px;
            font-size: 1rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-offset-sm);
            margin-top: var(--space-xs);
        }

        /* Mensaje de error rojo suave con animación shake */
        .join-error {
            background: #FEF2F2;
            color: var(--danger);
            border: 1.5px solid var(--danger);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            line-height: 1.4;
            display: none;
            animation: shake 0.3s ease-in-out;
        }

        .join-error.visible {
            display: block;
        }

        .join-error.join-error--success {
            background: #F0FDF4;
            color: #16A34A;
            border-color: #16A34A;
            animation: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* Estado de Carga */
        .join-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-xl) 0;
            gap: var(--space-md);
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--surface-soft);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="join-container">
            <div id="join-card" class="join-card">
                <!-- El JS generará el contenido dinámicamente -->
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '/js/core/supabase.js';

        const joinCard = document.getElementById('join-card');

        async function init() {
            // Estado de carga inicial
            joinCard.innerHTML = `
                <div class="join-loading">
                    <div class="spinner"></div>
                    <p>Cargando información del portal...</p>
                </div>
            `;

            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) {
                renderFatalError('Link inválido');
                return;
            }

            try {
                // 1. Obtener la empresa por slug
                const { data: company, error: companyError } = await supabase
                    .from('companies')
                    .select('*')
                    .eq('slug', slug)
                    .single();

                if (companyError || !company) {
                    renderFatalError('Empresa no encontrada');
                    return;
                }

                // 2. Si ya hay sesión activa con rol 'employee' y pertenece a esta empresa, redirigir
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    const { data: profile } = await supabase
                        .from('user_profiles')
                        .select('*')
                        .eq('id', session.user.id)
                        .single();

                    if (profile && profile.role === 'employee' && profile.company_id === company.id) {
                        window.location.href = '/album.html';
                        return;
                    }
                }

                // 3. Todo correcto -> Renderizar la vista principal
                renderJoinForm(company);

            } catch (err) {
                console.error('Error durante la inicialización:', err);
                renderFatalError('Error de conexión con el servidor');
            }
        }

        function renderFatalError(message) {
            joinCard.innerHTML = `
                <div class="join-header">
                    <div class="join-logo-emoji">⚠️</div>
                    <h2 class="join-company-name">Acceso no autorizado</h2>
                </div>
                <div class="join-error visible" style="text-align: center; font-weight: 600;">
                    ${message}
                </div>
            `;
        }

        function renderJoinForm(company) {
            joinCard.innerHTML = `
                <div class="join-header">
                    <div class="join-logo-emoji">🏆</div>
                    <h2 class="join-company-name">${company.name}</h2>
                    <p class="join-subtitle">Bienvenido al álbum digital de láminas de tu empresa</p>
                </div>

                <div class="join-tabs">
                    <button id="tab-login" class="active">Iniciar sesión</button>
                    <button id="tab-register">Registrarse</button>
                </div>

                <!-- Formulario Iniciar Sesión -->
                <form id="form-login" class="join-form">
                    <div class="form-group">
                        <label class="form-label" for="login-email">Correo Electrónico</label>
                        <input type="email" id="login-email" class="form-input" placeholder="tu.correo@empresa.com" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="login-password">Contraseña</label>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" id="btn-login" class="btn btn-primary">Entrar</button>
                    <div id="login-error" class="join-error"></div>
                </form>

                <!-- Formulario Registro -->
                <form id="form-register" class="join-form" hidden>
                    <div class="form-group">
                        <label class="form-label" for="reg-name">Nombre Completo</label>
                        <input type="text" id="reg-name" class="form-input" placeholder="Juan Pérez" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-email">Correo Electrónico</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="tu.correo@empresa.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="Mínimo 6 caracteres" minlength="6" required autocomplete="new-password">
                    </div>
                    <button type="submit" id="btn-register" class="btn btn-primary">Crear cuenta</button>
                    <div id="register-error" class="join-error"></div>
                </form>
            `;

            // Enlazar los elementos DOM interactivos
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const btnLogin = document.getElementById('btn-login');
            const btnRegister = document.getElementById('btn-register');
            const loginError = document.getElementById('login-error');
            const registerError = document.getElementById('register-error');

            // Switch entre pestañas (tabs)
            tabLogin.addEventListener('click', () => {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                formLogin.hidden = false;
                formRegister.hidden = true;
                loginError.classList.remove('visible');
            });

            tabRegister.addEventListener('click', () => {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                formRegister.hidden = false;
                formLogin.hidden = true;
                registerError.classList.remove('visible');
            });

            // Flujo de Inicio de Sesión
            formLogin.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                try {
                    loginError.classList.remove('visible');
                    btnLogin.disabled = true;
                    btnLogin.textContent = 'Entrando...';

                    // 1. Iniciar sesión con email y contraseña
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;

                    const { data: profile, error: profileError } = await supabase
                        .from('user_profiles')
                        .select('*')
                        .eq('id', data.user.id)
                        .single();

                    if (profileError || !profile) {
                        // Usuario en auth pero sin perfil — completar registro
                        const { error: rpcError } = await supabase.rpc('fn_register_employee', {
                            p_user_id: data.user.id,
                            p_company_id: company.id,
                            p_display_name: data.user.email.split('@')[0]
                        });
                        if (rpcError && !rpcError.message.includes('USER_ALREADY_REGISTERED')) {
                            await supabase.auth.signOut();
                            if (rpcError.message.includes('EMAIL_NOT_AUTHORIZED')) {
                                throw new Error('Tu correo no está en la lista de acceso de esta empresa. Contacta a tu administrador.');
                            }
                            throw new Error('Error al completar el registro. Intenta de nuevo.');
                        }
                        window.location.href = '/album.html';
                        return;
                    }

                    if (profile.company_id !== company.id) {
                        await supabase.auth.signOut();
                        throw new Error('Esta cuenta pertenece a otra empresa. Usa el link correcto de tu empresa.');
                    }

                    // 3. Redirigir al álbum si todo coincide
                    window.location.href = '/album.html';

                } catch (err) {
                    console.error('Error al iniciar sesión:', err);
                    loginError.textContent = err.message || 'Error al iniciar sesión';
                    loginError.classList.add('visible');
                } finally {
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Entrar';
                }
            });

            // Flujo de Registro
            formRegister.addEventListener('submit', async (e) => {
                e.preventDefault();
                const displayName = document.getElementById('reg-name').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;

                try {
                    registerError.classList.remove('visible');
                    btnRegister.disabled = true;
                    btnRegister.textContent = 'Creando cuenta...';

                    // 1. Verificar whitelist ANTES de crear el usuario
                    const { data: isAllowed, error: whitelistError } = await supabase
                        .rpc('fn_check_email_allowed', {
                            p_email: email,
                            p_company_id: company.id
                        });

                    if (whitelistError || !isAllowed) {
                        throw new Error('EMAIL_NOT_AUTHORIZED');
                    }

                    // 2. Registrar usuario pasando company_id en metadata
                    //    El trigger fn_on_user_created lo usa para crear user_profile
                    const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                company_id: company.id,
                                role: 'employee',
                                display_name: displayName
                            }
                        }
                    });
                    if (signUpError) throw signUpError;

                    if (!signUpData.user) {
                        throw new Error('No se pudo registrar la cuenta. Por favor intente de nuevo.');
                    }

                    // 3. Crear user_pack_status si el trigger no lo hizo
                    //    (el trigger lo crea solo si company_id no es null)
                    await supabase
                        .from('user_pack_status')
                        .upsert({
                            user_id: signUpData.user.id,
                            company_id: company.id,
                            packs_available: 0
                        }, { onConflict: 'user_id' });

                    // 4. Redirigir al álbum
                    window.location.href = '/album.html';

                } catch (err) {
                    console.error('Error en registro:', err);
                    let errorMsg = err.message || 'Error al registrarse';
                    
                    // Manejo de errores específicos detallados en los requisitos
                    if (err.message && err.message.includes('EMAIL_NOT_AUTHORIZED')) {
                        errorMsg = 'Tu correo no está en la lista de acceso de esta empresa. Contacta a tu administrador.';
                    } else if (err.message && err.message.includes('USER_ALREADY_REGISTERED')) {
                        errorMsg = 'Ya tienes una cuenta. Usa la pestaña Iniciar sesión.';
                        registerError.classList.add('join-error--success');
                    } else {
                        registerError.classList.remove('join-error--success');
                    }

                    registerError.textContent = errorMsg;
                    registerError.classList.add('visible');
                } finally {
                    btnRegister.disabled = false;
                    btnRegister.textContent = 'Crear cuenta';
                }
            });
        }

        // Inicializar cuando el DOM esté listo
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
